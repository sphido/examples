name: CI

on:
  push:
  pull_request:
  schedule:
    # weekly run catches breakage from newly released @sphido versions
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  examples:
    name: ${{ matrix.example }} on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [basic, extenders, json, rss, sitemap]
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      # no lockfiles on purpose — resolving the latest matching @sphido
      # versions is exactly what this CI is meant to test, so @sphido/*
      # is exempt from pnpm's default one-day minimumReleaseAge
      - run: pnpm install --config.minimum-release-age-exclude='@sphido/*'
        working-directory: ${{ matrix.example }}

      - run: node index.js
        working-directory: ${{ matrix.example }}
